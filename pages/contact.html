<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <title>Контакти</title>
</head>

<body>

<nav>
  <a href="../index.html">Головна</a>
  <a href="about.html">Про мене</a>
  <a href="contact.html">Контакти</a>
</nav>

<main class="container">

<h1>Контакти</h1>

<form action="./submit.html" method="get">

  <div class="form-group">
    <label for="name">Ім’я:</label>
    <input id="name" name="name" type="text" required minlength="2">
  </div>

  <div class="form-group">
    <label for="email">Email:</label>
    <input id="email" name="email" type="email" required>
  </div>

  <div class="form-group">
    <label for="phone">Телефон:</label>
    <input id="phone" name="phone" type="tel">
  </div>

  <div class="form-group">
    <label for="topic">Тема:</label>
    <select id="topic" name="topic">
      <option>Навчання</option>
      <option>Робота</option>
      <option>Інше</option>
    </select>
  </div>

  <fieldset>
    <legend>Спосіб зв'язку</legend>
    <label><input type="radio" name="contactWay" value="email" checked> Email</label>
    <label><input type="radio" name="contactWay" value="phone"> Телефон</label>
  </fieldset>

  <div class="form-group">
    <label for="message">Повідомлення:</label>
    <textarea id="message" name="message"></textarea>
  </div>

  <div class="form-group">
    <label>
      <input type="checkbox" required>
      Погоджуюсь з правилами
    </label>
  </div>

  <button type="submit">Надіслати</button>

</form>

</main>

</body>
</html>

<script src="./js/main.js" defer></script>
